<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>CabAI — 開源專案橫幅預覽</title>
<script>
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  if (/[?&]capture=1(&|$)/.test(location.search)) d.classList.add('capture');
  // Failsafe: if the main script never initialises, reveal everything.
  setTimeout(function () {
    var b = document.getElementById('banner');
    if (!b || !b.classList.contains('is-ready')) d.classList.remove('js');
  }, 1500);
})();
</script>
<style>
  :root {
    --ink: #0b1513;
    --emerald: #077962;
    --cream: #eef1ef;
    --amber: #f7d889;
    --paper: #ebe5dc;
    --font-zh: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --font-display: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, var(--font-zh);
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    --ease: cubic-bezier(.16, .7, .2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--paper) linear-gradient(180deg, #f2ede5 0%, #e7e0d4 100%);
    color: var(--ink);
    font-family: var(--font-zh);
  }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Preview page ---------- */
  .page {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: clamp(16px, 3vw, 40px);
  }
  .stage {
    width: 100%;
    max-width: 1440px;
    container: stage / inline-size;
  }

  /* ---------- Banner ---------- */
  .banner {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    overflow: hidden;
    isolation: isolate;
    color: var(--cream);
    background:
      radial-gradient(55% 80% at 72% 50%, rgba(7, 121, 98, .55), rgba(7, 121, 98, 0) 70%),
      radial-gradient(28% 40% at 94% 28%, rgba(247, 216, 137, .14), rgba(247, 216, 137, 0) 70%),
      linear-gradient(90deg, #0b1513 0 38%, #0e231d 100%);
    box-shadow: 0 1px 0 rgba(11, 21, 19, .08), 0 34px 60px -34px rgba(11, 21, 19, .55);
  }

  .art, .layers {
    position: absolute;
    inset: -8px;
    translate: var(--px, 0px) var(--py, 0px);
    transition: translate .5s var(--ease);
  }
  .art { z-index: 0; }
  .art__img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
  }

  .shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(11, 21, 19, .9) 0%, rgba(11, 21, 19, .72) 27%, rgba(11, 21, 19, .2) 45%, rgba(11, 21, 19, 0) 58%),
      linear-gradient(0deg, rgba(11, 21, 19, .4) 0%, rgba(11, 21, 19, 0) 20%);
  }

  /* Fanned emerald page planes */
  .planes {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
    translate: calc(var(--px, 0px) * .5) calc(var(--py, 0px) * .5);
    transition: translate .5s var(--ease);
  }
  .plane {
    position: absolute;
    left: 37%;
    bottom: 12%;
    width: 11cqw;
    height: 34cqw;
    transform-origin: 0 100%;
    rotate: var(--r);
    background: linear-gradient(180deg, rgba(7, 121, 98, .3) 0%, rgba(7, 121, 98, .07) 65%, rgba(7, 121, 98, 0) 100%);
    border-left: 1px solid rgba(238, 241, 239, .34);
    border-top: 1px solid rgba(238, 241, 239, .16);
  }
  .p1 { --r: 6deg; }
  .p2 { --r: 17deg; opacity: .75; }
  .p3 { --r: 29deg; opacity: .5; }

  /* Print-like structure */
  .split {
    position: absolute;
    z-index: 2;
    left: 40%;
    top: 6%;
    bottom: 6%;
    width: 9px;
    margin-left: -4px;
    pointer-events: none;
    background:
      linear-gradient(90deg, transparent 4px, rgba(238, 241, 239, .22) 4px 5px, transparent 5px),
      repeating-linear-gradient(180deg, rgba(238, 241, 239, .3) 0 1px, transparent 1px 2.4cqw);
    background-size: 100% 100%, 5px 100%;
    background-position: 0 0, 2px 0;
    background-repeat: no-repeat;
  }
  .split::after {
    content: "";
    position: absolute;
    left: 0;
    top: 44%;
    width: 9px;
    height: 1px;
    background: var(--amber);
  }

  .marks { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .marks i {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 0 solid rgba(238, 241, 239, .5);
  }
  .marks i:nth-child(1) { top: max(12px, 1.25cqw); left: max(12px, 1.25cqw); border-top-width: 1px; border-left-width: 1px; }
  .marks i:nth-child(2) { top: max(12px, 1.25cqw); right: max(12px, 1.25cqw); border-top-width: 1px; border-right-width: 1px; }
  .marks i:nth-child(3) { bottom: max(12px, 1.25cqw); left: max(12px, 1.25cqw); border-bottom-width: 1px; border-left-width: 1px; }
  .marks i:nth-child(4) { bottom: max(12px, 1.25cqw); right: max(12px, 1.25cqw); border-bottom-width: 1px; border-right-width: 1px; }

  .plate {
    position: absolute;
    z-index: 5;
    top: 2.6cqw;
    right: 3cqw;
    margin: 0;
    font: 500 max(9px, .62cqw)/1 var(--font-mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(238, 241, 239, .6);
    text-shadow: 0 1px 8px rgba(11, 21, 19, .8);
  }

  /* Knowledge-layer labels tied to the art */
  .layers {
    z-index: 3;
    margin: 0;
    padding: 0;
    list-style: none;
    pointer-events: none;
  }
  .layer {
    position: absolute;
    display: flex;
    align-items: center;
    gap: .8cqw;
    font-size: max(11px, .84cqw);
    line-height: 1.3;
    white-space: nowrap;
    color: var(--cream);
    text-shadow: 0 1px 10px rgba(11, 21, 19, .9), 0 0 2px rgba(11, 21, 19, .7);
  }
  .layer--pages { left: 63%; top: 19%; }
  .layer--structure { left: 71.5%; top: 66%; }
  .layer__node {
    flex: none;
    width: 9px;
    height: 9px;
    border: 1px solid var(--amber);
    rotate: 45deg;
    position: relative;
  }
  .layer__node::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: var(--amber);
  }
  .layer__lead {
    flex: none;
    width: 5.5cqw;
    height: 1px;
    background: rgba(238, 241, 239, .75);
    transform-origin: 0 50%;
  }
  .layer__text {
    display: grid;
    gap: .35em;
    padding: .5em 1.6em .5em .7em;
    background: linear-gradient(90deg, rgba(11, 21, 19, .55), rgba(11, 21, 19, 0));
    border-left: 1px solid rgba(238, 241, 239, .35);
  }
  .layer__idx {
    font-family: var(--font-mono);
    font-size: .84em;
    letter-spacing: .16em;
    color: var(--amber);
  }
  .layer__desc { font-weight: 600; letter-spacing: .06em; }

  /* Copy column */
  .copy {
    position: absolute;
    z-index: 4;
    top: 0;
    bottom: 0;
    left: 5cqw;
    width: 47cqw;
    padding-block: 4.2cqw 3.6cqw;
    display: flex;
    flex-direction: column;
  }
  .lockup { margin-block: auto; }

  .meta {
    margin: 0;
    display: flex;
    align-items: center;
    gap: .9em;
    font-size: max(11px, .8cqw);
    line-height: 1;
    font-weight: 600;
    letter-spacing: .22em;
    color: rgba(238, 241, 239, .8);
  }
  .meta__rule { flex: none; width: 3.2cqw; height: 1px; background: var(--amber); }
  .meta__en {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: .92em;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(238, 241, 239, .6);
  }

  .name {
    margin: 0 0 0 -.055em;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16.5cqw;
    line-height: .78;
    letter-spacing: -.06em;
    white-space: nowrap;
    color: var(--cream);
  }
  .name__ai { color: #2fa98b; }
  @supports ((-webkit-text-stroke: 1px) and ((background-clip: text) or (-webkit-background-clip: text))) {
    .name__ai {
      color: transparent;
      -webkit-text-stroke: max(1px, .1cqw) rgba(238, 241, 239, .9);
      background: linear-gradient(168deg, rgba(10, 150, 120, .78) 0%, rgba(7, 121, 98, .28) 58%, rgba(247, 216, 137, .26) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
  }

  .rule {
    position: relative;
    display: block;
    width: calc(100% + 6cqw);
    height: 1px;
    margin: 2.2cqw 0 2.4cqw;
    background: linear-gradient(90deg, rgba(238, 241, 239, .6) 0%, rgba(238, 241, 239, .6) 70%, rgba(238, 241, 239, 0) 100%);
    transform-origin: 0 50%;
  }
  .rule::before {
    content: "";
    position: absolute;
    left: 0;
    top: -4px;
    width: 1px;
    height: 9px;
    background: var(--amber);
  }

  .title {
    margin: 0;
    font-size: 4.15cqw;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: .02em;
    color: var(--cream);
  }
  .title__line { display: block; }
  .title .accent { color: var(--amber); }

  .support {
    margin: 1.6cqw 0 0;
    font-size: max(14px, 1.3cqw);
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: .06em;
    color: rgba(238, 241, 239, .84);
  }

  .colophon {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 1em;
    font-size: max(11px, .86cqw);
    line-height: 1.2;
    letter-spacing: .14em;
    color: rgba(238, 241, 239, .7);
  }
  .colophon__rule { flex: none; width: 5cqw; height: 1px; background: rgba(238, 241, 239, .42); }

  /* ---------- Mobile re-composition (390 × ~700) ---------- */
  @container stage (max-width: 639px) {
    .banner {
      aspect-ratio: auto;
      height: clamp(640px, 180cqw, 780px);
      background:
        radial-gradient(80% 45% at 70% 26%, rgba(7, 121, 98, .55), rgba(7, 121, 98, 0) 70%),
        var(--ink);
    }
    .art, .layers { inset: 0 0 auto 0; height: 60%; translate: none; }
    .art__img { object-position: 78% 45%; }
    .shade {
      background: linear-gradient(180deg,
        rgba(11, 21, 19, .6) 0%, rgba(11, 21, 19, 0) 16%,
        rgba(11, 21, 19, 0) 34%, rgba(11, 21, 19, .72) 50%, var(--ink) 61%);
    }
    .planes { translate: none; }
    .plane { left: 8%; bottom: 40%; width: 26cqw; height: 60cqw; }
    .split, .plate, .meta__en { display: none; }

    .layer { gap: 2cqw; font-size: 11px; }
    .layer--pages { left: 38%; top: 15%; }
    .layer--structure { left: 44%; top: 44%; }
    .layer__lead { width: 6cqw; }

    .copy {
      left: 6cqw;
      right: 6cqw;
      width: auto;
      padding-block: 6cqw 7cqw;
    }
    .lockup { margin-block: auto 0; }
    .meta { font-size: 11px; }
    .meta__rule { width: 8cqw; }
    .name { font-size: 30cqw; }
    .rule { width: 100%; margin: 4cqw 0 5cqw; }
    .title { font-size: 9.4cqw; }
    .support { font-size: max(14px, 3.9cqw); margin-top: 3.4cqw; }
    .colophon { margin-top: 6cqw; font-size: 11px; }
    .colophon__rule { width: 10cqw; }
  }

  /* ---------- Entrance (JS-enabled only, settles < 1s) ---------- */
  .js .banner:not(.is-ready) .anim { opacity: 0; }

  @keyframes art-in { from { opacity: 0; scale: 1.035; } to { opacity: 1; scale: 1; } }
  @keyframes rise { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { scale: 0 1; } to { scale: 1 1; } }
  @keyframes plane-in { from { opacity: 0; translate: -1.2cqw 0; } to { opacity: 1; translate: 0 0; } }

  .is-playing .art__img { animation: art-in .9s var(--ease) both; }
  .is-playing .plane { animation: plane-in .6s var(--ease) both; }
  .is-playing .p1 { animation-delay: .15s; }
  .is-playing .p2 { animation-delay: .22s; }
  .is-playing .p3 { animation-delay: .29s; }
  .is-playing .split { animation: fade .5s .1s ease-out both; }
  .is-playing .marks,
  .is-playing .plate { animation: fade .5s ease-out both; }
  .is-playing .meta { animation: rise .52s .08s var(--ease) both; }
  .is-playing .name { animation: rise .64s .14s var(--ease) both; }
  .is-playing .rule { animation: draw .56s .26s var(--ease) both; }
  .is-playing .title { animation: rise .6s .26s var(--ease) both; }
  .is-playing .support { animation: rise .56s .34s var(--ease) both; }
  .is-playing .colophon { animation: fade .48s .42s ease-out both; }
  .is-playing .layer { animation: fade .52s .38s ease-out both; }
  .is-playing .layer--structure { animation-delay: .44s; }
  .is-playing .layer__lead { animation: draw .48s .42s var(--ease) both; }

  /* Reduced-motion opt-in replay: opacity only */
  .is-gentle.is-playing .anim,
  .is-gentle.is-playing .layer__lead { animation-name: fade !important; }

  .banner.is-static .anim,
  .banner.is-static .layer__lead { animation: none !important; }
  .banner.is-static .art,
  .banner.is-static .layers,
  .banner.is-static .planes { translate: none !important; transition: none; }

  /* ---------- Toolbar (outside #banner) ---------- */
  .toolbar {
    width: 100%;
    max-width: 1440px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .toolbar[hidden] { display: none; }
  .toolbar__label {
    margin-right: auto;
    font: 500 11px/1 var(--font-mono);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(11, 21, 19, .62);
  }
  .toolbar button {
    min-height: 36px;
    padding: 9px 14px;
    border: 1px solid rgba(11, 21, 19, .6);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: 600 13px/1 var(--font-zh);
    letter-spacing: .08em;
    cursor: pointer;
  }
  .toolbar button:hover:not(:disabled) { background: rgba(11, 21, 19, .07); }
  .toolbar button[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .toolbar button:focus-visible { outline: 2px solid var(--emerald); outline-offset: 3px; }
  .toolbar button:disabled { opacity: .45; cursor: not-allowed; }

  .nojs-note {
    margin: 0;
    font-size: 12px;
    color: rgba(11, 21, 19, .7);
  }

  @media (max-width: 639px) {
    .page { padding: 0 0 16px; justify-content: flex-start; }
    .toolbar, .nojs-note { padding-inline: 16px; }
  }

  /* Capture/export mode: no chrome, final static frame */
  .capture .page { padding: 0; min-height: 0; display: block; }
  .capture .toolbar { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <div class="stage">
    <section id="banner" class="banner" aria-labelledby="banner-name banner-title">
      <div class="art">
        <img class="art__img anim" src="background.png" width="1440" height="720" decoding="async"
             alt="半透明翡翠玻璃書頁層層摺疊展開，立於淺色礦石台座上，側面有琥珀色光。"
             onerror="this.style.visibility='hidden'">
      </div>
      <div class="shade" aria-hidden="true"></div>

      <div class="planes" aria-hidden="true">
        <i class="plane p1 anim"></i>
        <i class="plane p2 anim"></i>
        <i class="plane p3 anim"></i>
      </div>
      <div class="split anim" aria-hidden="true"></div>

      <ul class="layers" aria-label="知識層">
        <li class="layer layer--pages anim">
          <span class="layer__node" aria-hidden="true"></span>
          <span class="layer__lead" aria-hidden="true"></span>
          <span class="layer__text">
            <span class="layer__idx">01 · 頁層</span>
            <span class="layer__desc">讓學員學會你的方法</span>
          </span>
        </li>
        <li class="layer layer--structure anim">
          <span class="layer__node" aria-hidden="true"></span>
          <span class="layer__lead" aria-hidden="true"></span>
          <span class="layer__text">
            <span class="layer__idx">02 · 結構層</span>
            <span class="layer__desc">讓 AI 依授權取用內容</span>
          </span>
        </li>
      </ul>

      <div class="copy">
        <p class="meta anim">
          <span class="meta__rule" aria-hidden="true"></span>
          <span>開源・自架</span>
          <span class="meta__en" lang="en">Open source · Self-hosted</span>
        </p>
        <div class="lockup">
          <p class="name anim">
            <span class="sr-only" id="banner-name">CabAI</span>
            <span aria-hidden="true"><span class="name__cab">Cab</span><span class="name__ai">AI</span></span>
          </p>
          <span class="rule anim" aria-hidden="true"></span>
          <h1 class="title anim" id="banner-title">
            <span class="title__line">你的知識<span class="accent">，</span></span>
            <span class="title__line">不只被閱讀。</span>
          </h1>
          <p class="support anim">開課、經營會員，也讓 AI 接著用。</p>
        </div>
        <p class="colophon anim">
          <span class="colophon__rule" aria-hidden="true"></span>
          <span>自己架設的開源平台，做自己的品牌。</span>
        </p>
      </div>

      <div class="marks anim" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="plate anim" aria-hidden="true" lang="en">Pl. 01 — Open Knowledge Atelier</p>
    </section>
  </div>

  <div class="toolbar" role="group" aria-label="橫幅預覽控制" hidden>
    <span class="toolbar__label" aria-hidden="true">Banner preview</span>
    <button type="button" id="btn-replay">重播</button>
    <button type="button" id="btn-static" aria-pressed="false">靜態畫面</button>
    <span class="sr-only" id="banner-status" role="status" aria-live="polite"></span>
  </div>
  <noscript><p class="nojs-note">未啟用 JavaScript：顯示靜態畫面。</p></noscript>
</main>

<script>
(function () {
  var root = document.documentElement;
  var banner = document.getElementById('banner');
  var toolbar = document.querySelector('.toolbar');
  var btnReplay = document.getElementById('btn-replay');
  var btnStatic = document.getElementById('btn-static');
  var status = document.getElementById('banner-status');
  if (!banner) return;

  var capture = root.classList.contains('capture');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  var MAX_SHIFT = 6;
  var isStatic = capture || reduce.matches;
  var frame = 0;
  var target = { x: 0, y: 0 };

  function setDepth(x, y) {
    banner.style.setProperty('--px', x.toFixed(2) + 'px');
    banner.style.setProperty('--py', y.toFixed(2) + 'px');
  }

  function resetDepth() {
    target.x = 0;
    target.y = 0;
    setDepth(0, 0);
  }

  function canParallax() {
    return !isStatic && !reduce.matches && finePointer.matches && banner.clientWidth >= 640;
  }

  function play() {
    if (isStatic) return;
    banner.classList.toggle('is-gentle', reduce.matches);
    banner.classList.remove('is-playing');
    void banner.offsetWidth;
    banner.classList.add('is-playing');
  }

  function applyState(announce) {
    banner.classList.toggle('is-static', isStatic);
    btnStatic.setAttribute('aria-pressed', String(isStatic));
    btnReplay.disabled = isStatic;
    if (isStatic) {
      banner.classList.remove('is-playing');
      resetDepth();
    }
    if (announce) {
      status.textContent = isStatic ? '已切換為靜態畫面，動態效果已停止。' : '已恢復動態效果。';
    }
  }

  banner.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse' || !canParallax()) return;
    var r = banner.getBoundingClientRect();
    var nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
    var ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
    target.x = -nx * MAX_SHIFT;
    target.y = -ny * MAX_SHIFT;
    if (!frame) {
      frame = requestAnimationFrame(function () {
        frame = 0;
        setDepth(target.x, target.y);
      });
    }
  });
  banner.addEventListener('pointerleave', resetDepth);

  btnReplay.addEventListener('click', function () {
    play();
    status.textContent = '已重播進場動畫。';
  });

  btnStatic.addEventListener('click', function () {
    isStatic = !isStatic;
    applyState(true);
    if (!isStatic) play();
  });

  function onReduceChange() {
    if (reduce.matches && !isStatic) {
      isStatic = true;
      applyState(true);
    }
  }
  if (reduce.addEventListener) reduce.addEventListener('change', onReduceChange);
  else if (reduce.addListener) reduce.addListener(onReduceChange);

  banner.classList.add('is-ready');
  applyState(false);
  play();
  if (!capture && toolbar) toolbar.hidden = false;
})();
</script>
</body>
</html>
